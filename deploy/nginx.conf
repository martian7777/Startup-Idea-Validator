events { worker_connections 1024; }

http {
  server_tokens off;
  client_max_body_size 16k;
  limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
  map $request_method $run_limit_key { default ""; POST $binary_remote_addr; }
  limit_req_zone $run_limit_key zone=run_create:10m rate=2r/m;
  limit_conn_zone $binary_remote_addr zone=per_ip:10m;

  upstream frontend { server frontend:3000; keepalive 16; }
  upstream backend { server backend:8000; keepalive 16; }

  server {
    listen 8080 default_server;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /api/runs {
      limit_req zone=run_create burst=2 nodelay;
      limit_conn per_ip 10;
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
      limit_req zone=api_general burst=40 nodelay;
      limit_conn per_ip 20;
      proxy_buffering off;
      proxy_read_timeout 300s;
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health { proxy_pass http://backend; access_log off; }
    location / {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
