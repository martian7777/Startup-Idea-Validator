services:
  edge:
    image: nginx:1.29.5-alpine3.23
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    ports: ["8080:8080"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend: { condition: service_healthy }
      frontend: { condition: service_started }
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    expose: ["8000"]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args: { NEXT_PUBLIC_API_BASE: "" }
    expose: ["3000"]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped
